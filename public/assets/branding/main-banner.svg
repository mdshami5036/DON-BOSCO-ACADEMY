<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C" />
      <stop offset="50%" stop-color="#1E3E62" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <pattern id="schoolGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.07)" />
    </pattern>
  </defs>
  <rect width="1600" height="700" fill="url(#heroGrad)"/>
  <rect width="1600" height="700" fill="url(#schoolGrid)"/>
  
  <!-- Geometric Decorative Waves -->
  <path d="M0,550 Q400,480 800,560 T1600,520 L1600,700 L0,700 Z" fill="rgba(30, 58, 138, 0.4)"/>
  <path d="M0,600 Q400,540 800,620 T1600,580 L1600,700 L0,700 Z" fill="rgba(15, 23, 42, 0.8)"/>
  <line x1="0" y1="550" x2="1600" y2="520" stroke="url(#goldAccent)" stroke-width="2" opacity="0.5"/>

  <!-- Badges -->
  <g transform="translate(150, 100)">
    <rect x="0" y="0" width="280" height="38" rx="19" fill="rgba(234, 179, 8, 0.15)" stroke="#EAB308" stroke-width="1.5"/>
    <text x="140" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#FDE047" text-anchor="middle" letter-spacing="1.5">
      ★ ESTABLISHED 1997 ★
    </text>
  </g>

  <!-- Big Title -->
  <text x="150" y="220" font-family="'Cinzel', 'Georgia', serif" font-size="72" font-weight="900" fill="#FFFFFF" letter-spacing="2">
    DON BOSCO ACADEMY
  </text>
  <text x="150" y="285" font-family="'Georgia', serif" font-size="32" font-weight="700" fill="url(#goldAccent)" letter-spacing="3">
    RAIPUR BAZAR, NANPUR, SITAMARHI (BIHAR)
  </text>

  <!-- Tagline Banner -->
  <rect x="150" y="330" width="460" height="52" rx="10" fill="#991B1B" stroke="#F59E0B" stroke-width="2"/>
  <text x="380" y="365" font-family="'Cinzel', serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    KNOWLEDGE IS POWER
  </text>

  <!-- Features Badges -->
  <g transform="translate(150, 440)">
    <rect x="0" y="0" width="230" height="44" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)"/>
    <text x="115" y="28" font-family="sans-serif" font-size="15" font-weight="600" fill="#E2E8F0" text-anchor="middle">
      🏫 CBSE Pattern
    </text>

    <rect x="250" y="0" width="280" height="44" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)"/>
    <text x="390" y="28" font-family="sans-serif" font-size="15" font-weight="600" fill="#E2E8F0" text-anchor="middle">
      🏡 Residential Cum Day School
    </text>

    <rect x="550" y="0" width="240" height="44" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)"/>
    <text x="670" y="28" font-family="sans-serif" font-size="15" font-weight="600" fill="#E2E8F0" text-anchor="middle">
      📚 Play to Class 10th
    </text>
  </g>
</svg>